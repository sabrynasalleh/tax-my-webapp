{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}
<h1>Login</h1>

<br>

<form method="POST" action="{{ url_for('auth.login')}}">

    <label>Email</label>
    <input type="email" name="email" required><br>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button><br>

</form>

<br>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Company Profile
{% endblock %}

{% block content %}
<h1>Company Profile</h1>

<form method="POST">

    <label>Company Name</label>
    <input type="text" name="company_name" value="{{ company.company_name }}" required><br>
    <label>SSM Number</label>
    <input type="text" name="ssm_number" value="{{ company.ssm_number or '' }}" required><br>
    <label>Financial Year End</label>
    <input type="date" name="financial_year_end" value="{{ company.financial_year_end or '' }}" required><br>

    <button type="submit">Save changes</button>

</form>

{% endblock %}
